<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Valedissed{% endblock %}</title>
    
    <!-- Tailwind CSS (Play CDN para desarrollo inmediato) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-primary': '#ff4081',
                        'brand-secondary': '#7c4dff',
                    }
                }
            }
        }
    </script>
    
    <!-- Archivo CSS local (se usará en producción) -->
    <link href="{{ url_for('static', path='css/main.css') }}" rel="stylesheet">
    
    <!-- HTMX CDN (Para desarrollo rápido) -->
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>
    
    <!-- Alpine.js (Opcional, pero recomendado para UI interactiva ligera) -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    
    <!-- Header/Nav -->
    <nav class="bg-white shadow-sm border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center">
                    <a href="/" class="text-2xl font-bold text-brand-primary">Valedissed</a>
                </div>
                <div class="hidden sm:flex space-x-8">
                    <a href="/" class="text-gray-600 hover:text-brand-primary px-3 py-2 text-sm font-medium">Home</a>
                    <a href="/explore" class="text-gray-600 hover:text-brand-primary px-3 py-2 text-sm font-medium">Explorar</a>
                    <a href="/wall" class="text-gray-600 hover:text-brand-primary px-3 py-2 text-sm font-medium">The Wall</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/login" class="text-sm font-medium text-gray-700 hover:text-brand-primary">Entrar</a>
                    <a href="/register" class="bg-brand-primary text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-opacity-90 transition">Registro</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t mt-auto py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-gray-500 text-sm">
            <p>&copy; 2026 Valedissed. Hecho con ❤️ para Medellín.</p>
        </div>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
